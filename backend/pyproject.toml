[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Compliance Counsel backend"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"

# Core web stack
fastapi = ">=0.119.0,<0.120.0"
uvicorn = { extras = ["standard"], version = ">=0.38.0,<0.39.0" }

# Database
sqlalchemy = ">=2.0.44,<3.0.0"
psycopg2-binary = ">=2.9.11,<3.0.0"
alembic = ">=1.17.0,<2.0.0"

# Environment & security
python-dotenv = ">=1.1.1,<2.0.0"
passlib = { extras = ["bcrypt"], version = ">=1.7.4,<2.0.0" }
python-jose = { extras = ["cryptography"], version = ">=3.5.0,<4.0.0" }
email-validator = ">=2.3.0,<3.0.0"
python-multipart = ">=0.0.20,<0.0.21"
bcrypt = ">=5.0.0,<6.0.0"

# PDF & document handling
pymupdf = ">=1.26.5,<2.0.0"
pdfplumber = ">=0.11.7,<0.12.0"
pdfminer-six = ">=20250506,<20250507"
reportlab = ">=4.0.9,<5.0.0"

# Scheduling
apscheduler = ">=3.10.4,<4.0.0"

# Assistant / AI integrations
httpx = "^0.27.2"
duckduckgo-search = "^5.3.1"
sentence-transformers = ">=2.7.0,<3.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
