[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Alembic will read from the environment:
#   export DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/compliance_counsel
# If not set, env.py can still inject a default.
sqlalchemy.url = %(DATABASE_URL)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
